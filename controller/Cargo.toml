[package]
name = "fanstand-controller"
description = "Desktop controller for the BLE cooling laptop stand"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fanstand"
path = "src/main.rs"

[dependencies]
fanstand-protocol.workspace = true
anyhow = "1"
btleplug = "0.13"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
env_logger = "0.11"
futures = "0.3"
getrandom = "0.4"
log = "0.4"
sysinfo = { version = "0.40", default-features = false, features = ["system", "component"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "signal"] }
uuid = "1.26"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Performance"] }
